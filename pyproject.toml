[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnirag"
version = "1.0.0"
description = "Universal Multimodal Document Intelligence & RAG Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rag", "multimodal", "ocr", "qdrant", "streamlit", "arabic", "document-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "streamlit>=1.40,<2.0",
    "pydantic>=2.7,<3.0",
    "PyMuPDF>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "python-pptx>=0.6.23,<2.0",
    "pillow>=10.3,<12.0",
    "qdrant-client>=1.9,<2.0",
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
ocr = ["pytesseract>=0.3.10"]

[tool.setuptools.packages.find]
include = ["omnirag*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests across several components",
    "slow: tests that take more than a second",
]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
source = ["omnirag"]
omit = ["omnirag/ui/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
